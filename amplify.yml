version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --no-audit --no-fund
        - npx prisma generate
    build:
      # Amplify does not pass console environment variables to the Next.js
      # server runtime by default. Writing them into .env.production makes
      # them available to server components, API routes and SSR at runtime.
      - env | grep -e DATABASE_URL -e NEXTAUTH_URL -e NEXTAUTH_SECRET -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET -e JEV_API_KEY -e DEEPSEEK_API_KEY -e JEV_API_URL -e JEV_MODEL -e DEEPSEEK_BASE_URL -e DEEPSEEK_MODEL >> .env.production
      - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
